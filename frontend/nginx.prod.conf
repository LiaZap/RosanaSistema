server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Service worker: NUNCA cacheia stale (sempre pega a versao nova) ──
    # location = (exact) tem prioridade sobre o regex de assets abaixo.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ── HTML / SPA fallback: SEMPRE revalida ──
    # index.html nunca e servido "stale": o browser sempre confirma com o
    # servidor (304 se igual, 200 com a versao nova se mudou). Como o index.html
    # referencia os assets com hash, isso garante que o usuario SEMPRE pega o
    # bundle novo apos um deploy, SEM precisar de hard reload.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # Reverse-proxy API requests to backend container
    # NOTE: 'fce-api' is the EasyPanel service name; same docker network
    location /api/ {
        proxy_pass http://fce-api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket for Socket.io
    location /ws/ {
        proxy_pass http://fce-api:3001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── Assets com hash no nome (index-XXXX.js, index-XXXX.css) ──
    # Seguro cachear pra sempre: o Vite poe um hash no nome a cada build,
    # entao quando o codigo muda o nome do arquivo muda e o browser baixa o
    # novo automaticamente. (sw.js/manifest acima tem exact match e escapam.)
    location ~* \.(?:css|js|jpg|jpeg|png|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
