<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a7878" />
    <meta name="description" content="FCE Studio — Painel da DANI para WhatsApp SDR com IA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>FCE Studio — Filhos com Estilo</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            // Unregister SWs antigos pra invalidar caches
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) {
              try {
                await r.unregister();
              } catch {}
            }
            // Apagar todos os caches do navegador
            if (window.caches) {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            }
            // Registrar o novo (sem cacheamento, só pra notifications)
            await navigator.serviceWorker.register('/sw.js', {
              updateViaCache: 'none',
            });
          } catch {}
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
